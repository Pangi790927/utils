# Nodes without a type don't construct a clasic vku::object_t, instead they are constructed based on
# their value: integer are identified by their integer value, shaders by the existance of
# shader_type, etc.
vert_spirv:
  m_shader_type: VKU_SPIRV_VERTEX
  # should also have a posible "path"
  m_source: |
    #version 450

    // OBSL this isn't used for now
    layout(binding = 0) uniform ubo_t {
      mat4 model;
      mat4 view;
      mat4 proj;
    } ubo;

    // This shows us that macros work, but not sure how this would work with includes afterwards
    // but, meh, I don't really care, I'll simply paste the code there whenever I see an include
    // directive (from path or from a known name, not sure how I will decide on the name resplve)
    #define APPLY_ASSIGN(x, y) x = y

    layout(location = 0) in vec2 in_pos;
    layout(location = 1) in vec3 in_color;
    layout(location = 2) in vec2 in_tex;

    layout(location = 0) out vec3 out_color;
    layout(location = 1) out vec2 out_tex_coord;

    void main() {
      gl_Position = vec4(in_pos, 0.0, 1.0);

      APPLY_ASSIGN(out_color, in_color);
      APPLY_ASSIGN(out_tex_coord, in_tex);

    }

frag_spirv:
  m_shader_type: VKU_SPIRV_FRAGMENT
  m_source: |
    #version 450

    layout(location = 0) in vec3 in_color;      // this is referenced by the vert shader
    layout(location = 1) in vec2 in_tex_coord;  // this is referenced by the vert shader

    layout(location = 0) out vec4 out_color;
    layout(binding = 1) uniform sampler2D tex_sampler;

    void main() {
      out_color = vec4(in_color, 1.0);
      out_color = texture(tex_sampler, in_tex_coord);
    }

width: 800
height: 600

# Those are examples of user provided functions, the name must match the one inside the plugin and
# the calling convention is that of lua (i.e. read the manual and prototype is int fn(lua_State *))
fill_buffer_with_quad_vertices:
  m_type: vc::lua_function_t
  m_source: "[INTERNAL]"
fill_buffer_with_quad_indexes:
  m_type: vc::lua_function_t
  m_source: "[INTERNAL]"

staging_buffer:
  m_type: vkc::cpu_buffer_t
  m_size: (SIZEOF_VEC_2F + SIZEOF_VEC_3F + SIZEOF_VEC_2F) * 4
window:
  m_type: vku::window_t
  m_width: !ref width
  m_height: !ref height
  m_name: "Window Name Goes Here"
inst:
  m_type: vku::instance_t
surf:
  m_type: vku::surface_t
  m_window: !ref window
  m_instance: !ref inst
dev:
  m_type: vku::device_t
  m_instance: !ref inst
  m_surface: !ref surf
cp:
  m_type: vku::cmdpool_t
  m_device: !ref dev
view:
  m_type: vku::img_view_t
  m_image:
    m_type: vku::image_t
    m_tag: img
    m_cmdpool: !ref cp
    m_path: test_image.png
  m_aspect_mask: VK_IMAGE_ASPECT_COLOR_BIT
mvp_buff:
  m_type: vku::buffer_t
  m_device: !ref dev
  m_size: 1024
  m_usage_flags: VK_BUFFER_USAGE_UNIFORM_BUFFER_BIT
  m_sharing_mode: VK_SHARING_MODE_EXCLUSIVE
  m_memory_flags: [VK_MEMORY_PROPERTY_HOST_VISIBLE_BIT, VK_MEMORY_PROPERTY_HOST_COHERENT_BIT]
swc:
  m_type: vku::swapchain_t
  m_device: !ref dev
  m_surface: !ref surf
rp:
  m_type: vku::renderpass_t
  m_swapchain: !ref swc
bindings_initer:
  m_type: vku::desc_set_initializer_t
  m_descriptors:
    - m_type: vku::desc_set_initializer_t::buff_binding_t
      m_buffer: !ref mvp_buff
      m_desc:
        m_type: vkc::binding_t
        m_binding: 0
        m_stage: VK_SHADER_STAGE_VERTEX_BIT
        m_desc_type: VK_DESCRIPTOR_TYPE_UNIFORM_BUFFER
    - m_type: vku::desc_set_initializer_t::sampl_binding_t
      m_view: !ref view
      m_sampler:
        m_type: vku::img_sampl_t
        m_device: !ref dev
      m_desc:
        m_type: vkc::binding_t
        m_binding: 1
        m_stage: VK_SHADER_STAGE_VERTEX_BIT
        m_desc_type: VK_DESCRIPTOR_TYPE_COMBINED_IMAGE_SAMPLER
ds_lay:
  m_type: vku::desc_set_layout_t
  m_device: !ref dev
  m_bindings_initer: !ref bindings_initer
pl_lay:
  m_type: vku::pipeline_layout_t
  m_desc_set_layout: !ref ds_lay
pl:
  m_type: vku::pipeline_t
  m_width: !ref width
  m_height: !ref height
  m_renderpass: !ref rp
  m_input_desc:
    m_tag: "input_descriptor"
    m_type: vkc::vertex_input_desc_t
    m_binding: 0
    m_stride: SIZEOF_VEC_2F + SIZEOF_VEC_3F + SIZEOF_VEC_2F
    m_in_rate: VK_VERTEX_INPUT_RATE_VERTEX
    m_attrs:
      - m_location: 0
        m_binding: 0
        m_format: VK_FORMAT_R32G32_SFLOAT
        m_offset: 0
      - m_location: 1
        m_binding: 0
        m_format: VK_FORMAT_R32G32B32_SFLOAT
        m_offset: SIZEOF_VEC_2F
      - m_location: 2
        m_binding: 0
        m_format: VK_FORMAT_R32G32_SFLOAT
        m_offset: SIZEOF_VEC_2F + SIZEOF_VEC_3F
  m_topology: VK_PRIMITIVE_TOPOLOGY_TRIANGLE_LIST
  m_shaders:
    - m_type: vku::shader_t
      m_device: !ref dev
      m_spirv: !ref vert_spirv
    - m_type: vku::shader_t
      m_device: !ref dev
      m_spirv: !ref frag_spirv
  m_pipeline_layout: !ref pl_lay
fbs:
  m_type: vku::framebuffs_t
  m_renderpass: !ref rp
img_sem:
  m_type: vku::sem_t
  m_device: !ref dev
  # optional m_sem_type: VK_SEMAPHORE_TYPE_TIMELINE
  # optional m_initial: 11
draw_sem:
  m_type: vku::sem_t
  m_device: !ref dev
fence:
  m_type: vku::fence_t
  m_device: !ref dev
cbuff:
  m_type: vku::cmdbuff_t
  m_cmdpool: !ref cp
vbuff:
  m_type: vku::buffer_t
  m_device: !ref dev
  m_size: 1024
  m_usage_flags: [VK_BUFFER_USAGE_VERTEX_BUFFER_BIT, VK_BUFFER_USAGE_TRANSFER_DST_BIT]
  m_sharing_mode: VK_SHARING_MODE_EXCLUSIVE
  m_memory_flags: VK_MEMORY_PROPERTY_DEVICE_LOCAL_BIT
ibuff:
  m_type: vku::buffer_t
  m_device: !ref dev
  m_size: 1024
  m_usage_flags: [VK_BUFFER_USAGE_INDEX_BUFFER_BIT, VK_BUFFER_USAGE_TRANSFER_DST_BIT]
  m_sharing_mode: VK_SHARING_MODE_EXCLUSIVE
  m_memory_flags: VK_MEMORY_PROPERTY_DEVICE_LOCAL_BIT
desc_pool:
  m_type: vku::desc_pool_t
  m_device: !ref dev
  m_bindings_initer: !ref bindings_initer
  m_cnt: 1
desc_set:
  m_type: vku::desc_set_t
  m_descriptor_pool: !ref desc_pool
  m_desc_set_layout: !ref ds_lay
  m_bindings_initer: !ref bindings_initer

lua_script:
  m_source: |
    vc = require("virt_composer")

    function vku_init()
      vc.fill_buffer_with_quad_vertices(vc.staging_buffer:data(), vc.staging_buffer:size())
      vc.copy_from_cpu_to_gpu(vc.cp, vc.vbuff, vc.staging_buffer:data(), vc.staging_buffer:size(), 0)

      vc.fill_buffer_with_quad_indexes(vc.staging_buffer:data(), vc.staging_buffer:size())
      -- TODO: add vc.SIZEOF_INT32 to the internal variables
      vc.copy_from_cpu_to_gpu(vc.cp, vc.ibuff, vc.staging_buffer:data(), 4 * 6, 0)
    end

    function on_loop_run()
      vc.glfw_pool_events() -- needed for keys to be available
      if vc.get_key(vc.window, vc.GLFW_KEY_ESCAPE) == vc.GLFW_PRESS then
        vc.signal_close() -- this will close the loop
      end

      img_idx = vc.aquire_next_img(vc.swc, vc.img_sem)

      -- do mvp update somehow?

      vc.cbuff:begin(vc.VK_COMMAND_BUFFER_USAGE_NONE)
      vc.cbuff:begin_rpass(vc.fbs, img_idx)
      vc.cbuff:bind_vert_buffs(0, {{vc.vbuff, 0}});
      vc.cbuff:bind_idx_buff(vc.ibuff, 0, vc.VK_INDEX_TYPE_UINT32);
      vc.cbuff:bind_desc_set(vc.VK_PIPELINE_BIND_POINT_GRAPHICS, vc.pl_lay, vc.desc_set);
      vc.cbuff:draw_idx(vc.pl, 6);
      vc.cbuff:end_rpass();
      vc.cbuff:end_begin();

      vc.submit_cmdbuff({{vc.img_sem, vc.VK_PIPELINE_STAGE_COLOR_ATTACHMENT_OUTPUT_BIT}},
          vc.cbuff, vc.fence, {vc.draw_sem})
      vc.present(vc.swc, {vc.draw_sem}, img_idx)

      vc.wait_fences({vc.fence}, 1, -1)
      vc.reset_fences({vc.fence})
    end

